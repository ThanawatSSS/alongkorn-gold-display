<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a0000">
  <title>ร้านทองอลงกรณ์ - ราคาทองวันนี้</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-top: #8a0000;
      --bg-bottom: #250000;
      --panel: rgba(45, 0, 0, 0.72);
      --panel-strong: rgba(30, 0, 0, 0.86);
      --gold: #ffd700;
      --gold-bright: #ffe85c;
      --gold-border: #d9ad00;
      --text: #ffffff;
      --text-muted: #e4dddd;
      --up: #35ef89;
      --down: #ff6868;
      --warning: #ffd166;
      --shadow: 0 1.2rem 3rem rgba(0, 0, 0, 0.36);
      --radius: clamp(1rem, 1.8vw, 1.75rem);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg-bottom);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: clamp(0.75rem, 2vh, 1.75rem) clamp(0.75rem, 2vw, 2rem);
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 215, 0, 0.12), transparent 32rem),
        linear-gradient(140deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, Arial, sans-serif;
      overflow-x: hidden;
    }

    .display-grid {
      width: min(100%, 112rem);
      min-height: calc(100vh - clamp(1.5rem, 4vh, 3.5rem));
      min-height: calc(100dvh - clamp(1.5rem, 4vh, 3.5rem));
      margin-inline: auto;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: clamp(0.9rem, 2vw, 2.4rem);
      align-items: stretch;
    }

    .panel {
      border: clamp(2px, 0.25vw, 5px) solid var(--gold-border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .brand-panel {
      min-width: 0;
      padding: clamp(1rem, 2.7vw, 2.8rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(0.75rem, 1.7vh, 1.35rem);
    }

    .shop-logo {
      width: clamp(5.5rem, 10vw, 10rem);
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      filter: drop-shadow(0 0.7rem 1rem rgba(0, 0, 0, 0.32));
    }

    .shop-name {
      margin: 0;
      color: var(--gold);
      font-size: clamp(2rem, 4vw, 4.3rem);
      line-height: 1.05;
      font-weight: 800;
      text-wrap: balance;
      text-shadow: 0.08em 0.08em 0 #400000, 0 0.15em 0.35em rgba(0, 0, 0, 0.5);
    }

    .trend-card {
      width: min(100%, 40rem);
      padding: clamp(0.8rem, 1.4vw, 1.25rem) clamp(1rem, 2.4vw, 2.2rem);
      border: 2px solid rgba(230, 184, 0, 0.8);
      border-radius: 999px;
      background: rgba(30, 0, 0, 0.74);
      font-size: clamp(1.25rem, 2.3vw, 2.3rem);
      font-weight: 800;
      line-height: 1.25;
    }

    .info-stack {
      width: min(100%, 42rem);
      display: grid;
      gap: clamp(0.45rem, 1vh, 0.8rem);
      color: var(--text-muted);
      font-size: clamp(1rem, 1.4vw, 1.35rem);
      line-height: 1.45;
    }

    .info-stack strong {
      color: var(--gold-bright);
      font-size: 1.12em;
    }

    .price-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: clamp(0.8rem, 1.7vh, 1.35rem);
    }

    .price-card {
      min-width: 0;
      padding: clamp(1rem, 2.3vw, 2.4rem) clamp(1rem, 2.6vw, 2.8rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: clamp(2px, 0.22vw, 4px) solid var(--gold-border);
      border-radius: var(--radius);
      background: var(--panel-strong);
      box-shadow: var(--shadow);
    }

    .price-label {
      margin-bottom: clamp(0.3rem, 0.8vh, 0.75rem);
      color: var(--text-muted);
      font-size: clamp(1.25rem, 2vw, 2rem);
      font-weight: 650;
    }

    .price-value-row {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: clamp(0.5rem, 1.2vw, 1rem);
      white-space: nowrap;
    }

    .price-value {
      min-width: 0;
      color: var(--gold-bright);
      font-size: clamp(3.4rem, 8.6vw, 9rem);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0.035em 0.035em 0 #500000, 0 0.08em 0.16em rgba(0, 0, 0, 0.55);
    }

    .price-unit {
      flex: 0 0 auto;
      color: var(--gold-border);
      font-size: clamp(1.2rem, 2vw, 2rem);
      font-weight: 700;
    }

    .status-card {
      min-width: 0;
      padding: clamp(0.9rem, 1.6vw, 1.4rem) clamp(1rem, 2vw, 1.8rem);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: clamp(0.75rem, 1.6vw, 1.4rem);
      align-items: center;
      border-radius: var(--radius);
      background: rgba(45, 0, 0, 0.72);
      box-shadow: var(--shadow);
    }

    .clock {
      font-size: clamp(1.5rem, 2.5vw, 2.4rem);
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .status-copy {
      min-width: 0;
      display: grid;
      gap: 0.3rem;
      color: var(--text-muted);
      font-size: clamp(0.9rem, 1.2vw, 1.1rem);
      line-height: 1.35;
    }

    .status-line {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
    }

    .status-dot {
      width: 0.7em;
      height: 0.7em;
      margin-top: 0.3em;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #c7c7c7;
      box-shadow: 0 0 0.7rem currentColor;
    }

    .status-loading {
      color: #8bd3ff;
      background: currentColor;
    }

    .status-online {
      color: var(--up);
      background: currentColor;
    }

    .status-warning {
      color: var(--warning);
      background: currentColor;
    }

    .status-error {
      color: var(--down);
      background: currentColor;
    }

    .source-line {
      overflow-wrap: anywhere;
      opacity: 0.92;
    }

    .price-up {
      color: var(--up);
    }

    .price-down {
      color: var(--down);
    }

    .price-equal {
      color: var(--text);
    }

    @media (max-width: 900px) {
      body {
        padding: clamp(0.65rem, 2vw, 1rem);
      }

      .display-grid {
        min-height: auto;
        grid-template-columns: 1fr;
      }

      .brand-panel {
        padding-block: clamp(1.2rem, 5vw, 2rem);
      }

      .price-panel {
        grid-template-rows: auto;
      }

      .price-card {
        min-height: clamp(10rem, 35vw, 16rem);
      }

      .price-value {
        font-size: clamp(3.3rem, 17vw, 7rem);
      }
    }

    @media (max-width: 520px) {
      .status-card {
        grid-template-columns: 1fr;
      }

      .price-value-row {
        justify-content: space-between;
        gap: 0.35rem;
      }

      .price-value {
        font-size: clamp(3rem, 18vw, 5.4rem);
      }

      .price-unit {
        font-size: clamp(1rem, 5vw, 1.35rem);
      }

      .trend-card {
        border-radius: 1.1rem;
      }
    }

    @media (max-height: 760px) and (min-width: 901px) {
      body {
        padding-block: 0.65rem;
      }

      .display-grid {
        min-height: calc(100vh - 1.3rem);
        min-height: calc(100dvh - 1.3rem);
      }

      .brand-panel {
        gap: 0.55rem;
        padding-block: 0.85rem;
      }

      .shop-logo {
        width: clamp(4.2rem, 8vh, 6rem);
      }

      .shop-name {
        font-size: clamp(2rem, 3.5vw, 3.4rem);
      }

      .price-panel {
        gap: 0.65rem;
      }

      .price-card {
        padding-block: 0.8rem;
      }

      .price-value {
        font-size: clamp(3.6rem, 8vw, 7.2rem);
      }

      .status-card {
        padding-block: 0.7rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="display-grid">
    <section class="brand-panel panel" aria-labelledby="shop-title">
      <img src="logo_no_bg.png" class="shop-logo" alt="โลโก้ร้านทองอลงกรณ์">
      <h1 id="shop-title" class="shop-name">ร้านทองอลงกรณ์</h1>

      <div id="diff-info" class="trend-card price-equal" aria-live="polite">รอข้อมูล...</div>

      <div class="info-stack">
        <div id="prev-change-info">เทียบรอบก่อนหน้า: --</div>
        <div id="update-info">อัปเดต: --</div>
        <div>อัตราแลกเปลี่ยน USD: <strong id="usd-rate">--</strong> บาท</div>
      </div>
    </section>

    <section class="price-panel" aria-label="ราคาทองสมาคม">
      <article class="price-card">
        <div class="price-label">สมาคมฯ ขายออก</div>
        <div class="price-value-row">
          <span id="asso-sell" class="price-value">---</span>
          <span class="price-unit">บาท</span>
        </div>
      </article>

      <article class="price-card">
        <div class="price-label">สมาคมฯ รับซื้อ</div>
        <div class="price-value-row">
          <span id="asso-buy" class="price-value">---</span>
          <span class="price-unit">บาท</span>
        </div>
      </article>

      <footer class="status-card">
        <div id="clock" class="clock">--:--:-- น.</div>
        <div class="status-copy" aria-live="polite">
          <div class="status-line">
            <span id="status-dot" class="status-dot status-loading" aria-hidden="true"></span>
            <span id="sync-status">กำลังเชื่อมต่อ Gold Fetch...</span>
          </div>
          <div id="source-info" class="source-line">แหล่งข้อมูล: --</div>
        </div>
      </footer>
    </section>
  </main>

  <script>
    "use strict";

    const CONFIG = Object.freeze({
      endpoint: "https://script.google.com/macros/s/AKfycbz0J5nBF0gpJoTF5e4dr_j0BMZfmKS2Uh6lsJn_QI67iTkcUW2bEOSRbx9G4cFALmknbg/exec",
      refreshMs: 40_000,
      timeoutMs: 30_000,
      maxAttempts: 3,
      retryDelaysMs: [1_500, 4_000]
    });

    const el = {
      buy: document.getElementById("asso-buy"),
      sell: document.getElementById("asso-sell"),
      diff: document.getElementById("diff-info"),
      prevDiff: document.getElementById("prev-change-info"),
      update: document.getElementById("update-info"),
      usd: document.getElementById("usd-rate"),
      clock: document.getElementById("clock"),
      statusDot: document.getElementById("status-dot"),
      status: document.getElementById("sync-status"),
      source: document.getElementById("source-info")
    };

    const priceFormatter = new Intl.NumberFormat("th-TH", {
      maximumFractionDigits: 0
    });

    const exchangeFormatter = new Intl.NumberFormat("th-TH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    const bangkokClockFormatter = new Intl.DateTimeFormat("th-TH", {
      timeZone: "Asia/Bangkok",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

    const bangkokDateTimeFormatter = new Intl.DateTimeFormat("th-TH", {
      timeZone: "Asia/Bangkok",
      day: "numeric",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });

    let lastGoodData = null;
    let refreshTimer = null;
    let refreshInFlight = false;

    function toFiniteNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function parseApiDate(value) {
      if (!value) return null;

      const text = String(value).trim();
      if (!text) return null;

      const hasExplicitZone = /(?:Z|[+-]\d{2}:\d{2})$/i.test(text);
      const normalized = hasExplicitZone ? text : text + "+07:00";
      const date = new Date(normalized);

      return Number.isNaN(date.getTime()) ? null : date;
    }

    function setConnectionState(kind, message) {
      el.statusDot.className = "status-dot status-" + kind;
      el.status.textContent = message;
    }

    function setTrend(target, value, todayMode) {
      const number = toFiniteNumber(value);
      target.classList.remove("price-up", "price-down", "price-equal");

      if (number === null) {
        target.classList.add("price-equal");
        target.textContent = todayMode ? "ข้อมูลการเปลี่ยนแปลงไม่พร้อม" : "เทียบรอบก่อนหน้า: --";
        return;
      }

      if (number > 0) {
        target.classList.add("price-up");
        target.textContent = todayMode
          ? "▲ วันนี้ขึ้น " + priceFormatter.format(number) + " บาท"
          : "เทียบรอบก่อนหน้า: ▲ ขึ้น " + priceFormatter.format(number) + " บาท";
        return;
      }

      if (number < 0) {
        target.classList.add("price-down");
        target.textContent = todayMode
          ? "▼ วันนี้ลง " + priceFormatter.format(Math.abs(number)) + " บาท"
          : "เทียบรอบก่อนหน้า: ▼ ลง " + priceFormatter.format(Math.abs(number)) + " บาท";
        return;
      }

      target.classList.add("price-equal");
      target.textContent = todayMode ? "— ราคาเท่าเมื่อวาน —" : "เทียบรอบก่อนหน้า: — เท่าเดิม —";
    }

    function validateData(data) {
      if (!data || typeof data !== "object") {
        throw new Error("payload data ไม่ถูกต้อง");
      }

      const buy = toFiniteNumber(data.goldBar?.buy);
      const sell = toFiniteNumber(data.goldBar?.sell);

      if (buy === null || sell === null || buy <= 0 || sell <= 0) {
        throw new Error("ราคาทองใน payload ไม่ถูกต้อง");
      }

      return { buy, sell };
    }

    function renderGoldData(data) {
      const prices = validateData(data);

      el.buy.textContent = priceFormatter.format(prices.buy);
      el.sell.textContent = priceFormatter.format(prices.sell);

      setTrend(el.diff, data.change?.fromYesterday, true);
      setTrend(el.prevDiff, data.change?.fromPrevRound, false);

      const usdThb = toFiniteNumber(data.exchange?.usdThb);
      el.usd.textContent = usdThb === null ? "--" : exchangeFormatter.format(usdThb);

      const marketTime = parseApiDate(data.asTime);
      const seqText = data.seq !== undefined && data.seq !== null
        ? " (ครั้งที่ " + data.seq + ")"
        : "";

      el.update.textContent = marketTime
        ? "อัปเดตราคา: " + bangkokDateTimeFormatter.format(marketTime) + " น." + seqText
        : "อัปเดตราคา: --";

      const source = data.source ?? "unknown";
      const sourceId = data.goldPriceID ?? "--";
      el.source.textContent = "แหล่งข้อมูล: " + source + " • Gold Price ID: " + sourceId;

      // PriceLog only changes when GoldPriceID changes. An old recordedAt/asTime
      // can be normal when no new price has been announced.
      setConnectionState("online", "เชื่อมต่อ Gold Fetch สำเร็จ • แสดงราคาประกาศล่าสุด");
    }

    function validateEnvelope(payload) {
      if (!payload || typeof payload !== "object") {
        throw new Error("response ไม่ใช่ JSON object");
      }

      if (payload.success !== true) {
        const message =
          payload.error?.message ??
          payload.error ??
          payload.message ??
          "Gold Fetch รายงานว่าไม่สำเร็จ";
        throw new Error(String(message));
      }

      validateData(payload.data);
      return payload.data;
    }

    async function fetchGoldData() {
      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => controller.abort(), CONFIG.timeoutMs);

      try {
        const url = new URL(CONFIG.endpoint);
        url.searchParams.set("_ts", String(Date.now()));

        const response = await fetch(url.toString(), {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store",
          redirect: "follow",
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const payload = await response.json();
        return validateEnvelope(payload);
      } catch (error) {
        if (error?.name === "AbortError") {
          throw new Error("หมดเวลารอ Gold Fetch");
        }
        throw error;
      } finally {
        window.clearTimeout(timeoutId);
      }
    }

    function wait(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    async function fetchWithRetry() {
      let lastError = null;

      for (let attempt = 0; attempt < CONFIG.maxAttempts; attempt += 1) {
        try {
          return await fetchGoldData();
        } catch (error) {
          lastError = error;

          if (attempt < CONFIG.maxAttempts - 1) {
            setConnectionState(
              "loading",
              "เชื่อมต่อไม่สำเร็จ กำลังลองใหม่ " + (attempt + 2) + "/" + CONFIG.maxAttempts
            );
            await wait(CONFIG.retryDelaysMs[attempt] ?? CONFIG.retryDelaysMs.at(-1) ?? 2_000);
          }
        }
      }

      throw lastError ?? new Error("ไม่สามารถเชื่อมต่อ Gold Fetch");
    }

    function scheduleRefresh() {
      window.clearTimeout(refreshTimer);
      refreshTimer = window.setTimeout(refreshData, CONFIG.refreshMs);
    }

    async function refreshData() {
      if (refreshInFlight) return;

      refreshInFlight = true;
      window.clearTimeout(refreshTimer);

      if (!lastGoodData) {
        setConnectionState("loading", "กำลังเชื่อมต่อ Gold Fetch...");
      }

      try {
        const data = await fetchWithRetry();
        lastGoodData = data;
        renderGoldData(data);
      } catch (error) {
        const detail = error instanceof Error ? error.message : String(error);
        setConnectionState(
          "error",
          lastGoodData
            ? "เชื่อมต่อไม่ได้ • ยังแสดงข้อมูลล่าสุดที่มี"
            : "ไม่สามารถโหลดราคาทองได้"
        );
        el.source.textContent = "ข้อผิดพลาด: " + detail;
      } finally {
        refreshInFlight = false;
        scheduleRefresh();
      }
    }

    function updateClock() {
      el.clock.textContent = bangkokClockFormatter.format(new Date()) + " น.";
    }

    window.addEventListener("online", () => {
      setConnectionState("loading", "เครือข่ายกลับมาแล้ว กำลังอัปเดต...");
      refreshData();
    });

    window.addEventListener("offline", () => {
      setConnectionState("error", "ออฟไลน์ • ยังแสดงข้อมูลล่าสุดที่มี");
    });

    updateClock();
    window.setInterval(updateClock, 1_000);
    refreshData();
  </script>
</body>
</html>
